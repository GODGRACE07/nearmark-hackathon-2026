[package]
name = "nearmark-outlayer-worker"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "NEARMARK NASB-0.1 TEE receipt-signing worker"

[[bin]]
name = "nearmark-outlayer-worker"
path = "src/main.rs"

[dependencies]
outlayer = { version = "=0.2.1", features = ["signing-keys"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
