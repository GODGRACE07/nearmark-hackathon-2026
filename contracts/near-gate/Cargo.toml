[package]
name = "nearmark-gate"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Owner-mandated, restricted-agent NEAR payment gate for NEARMARK"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.1" }

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
near-workspaces = "=0.24.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
